<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legoify Character</title>
  <meta name="description" content="Build a 3D brick-built LEGO character — skin tone, hair, body, clothes — and spin it around." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23c8511b%22/><circle cx=%2230%22 cy=%2232%22 r=%2211%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225%22/><circle cx=%2270%22 cy=%2232%22 r=%2211%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%225%22/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="buildStage">
    <canvas id="scene"></canvas>

    <div id="loading"><span class="spinner"></span></div>

    <button id="panelToggle" aria-label="Toggle options">Edit</button>

    <aside id="panel">
      <section class="grp is-open" data-grp="skin">
        <button class="grp-head"><span>skin</span><span class="grp-val" id="skinVal"></span></button>
        <div class="grp-body"><div class="row" id="skinRow"></div></div>
      </section>

      <section class="grp" data-grp="hair">
        <button class="grp-head"><span>hair</span><span class="grp-val" id="hairVal"></span></button>
        <div class="grp-body">
          <div class="row pills" id="hairRow"></div>
          <div class="row" id="hairColorRow"></div>
        </div>
      </section>

      <section class="grp" data-grp="body">
        <button class="grp-head"><span>body</span><span class="grp-val" id="bodyVal"></span></button>
        <div class="grp-body"><div class="row pills" id="bodyRow"></div></div>
      </section>

      <section class="grp" data-grp="top">
        <button class="grp-head"><span>top</span><span class="grp-val" id="topVal"></span></button>
        <div class="grp-body">
          <div class="row pills" id="topRow"></div>
          <div class="row" id="topColorRow"></div>
        </div>
      </section>

      <section class="grp" data-grp="bottom">
        <button class="grp-head"><span>bottom</span><span class="grp-val" id="bottomVal"></span></button>
        <div class="grp-body">
          <div class="row pills" id="bottomRow"></div>
          <div class="row" id="bottomColorRow"></div>
        </div>
      </section>

      <section class="grp" data-grp="shoes">
        <button class="grp-head"><span>shoes</span><span class="grp-val" id="shoeVal"></span></button>
        <div class="grp-body"><div class="row" id="shoeColorRow"></div></div>
      </section>

      <section class="grp" data-grp="extras">
        <button class="grp-head"><span>extras</span><span class="grp-val" id="extrasVal"></span></button>
        <div class="grp-body">
          <div class="row pills" id="extrasRow">
            <button class="pill" data-flag="glasses">glasses</button>
            <button class="pill" data-flag="beard">beard</button>
          </div>
        </div>
      </section>
    </aside>

    <div id="dock">
      <div class="poses pills" id="poseRow"></div>
      <button id="shuffleBtn" class="icon-btn" title="Random character">shuffle</button>
      <button id="replayBtn" class="icon-btn" title="Replay the build">rebuild</button>
      <button id="photoBtn" class="icon-btn" title="Take the colours from a photo">photo</button>
      <button id="shotBtn" class="icon-btn" title="Save image">save</button>
    </div>

    <p id="brickTally"></p>
    <a id="siblingLink" href="https://legoify-likeness.vercel.app">likeness →</a>
    <input id="fileInput" type="file" accept="image/*" hidden />
  </main>

  <canvas id="sourceCanvas" hidden></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
